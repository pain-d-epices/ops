# Sert l'interface compilée et relaie l'API sur la même origine : les cookies
# d'authentification (httpOnly, SameSite) circulent ainsi sans CORS.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Taille d'une requête d'investigation : quelques kilo-octets suffisent.
    client_max_body_size 1m;

    # Résolveur interne de Docker, interrogé à chaque requête. Sans cela, nginx fige
    # l'adresse de l'API au démarrage : si le conteneur « api » est recréé, il reçoit
    # une nouvelle adresse et l'interface répond 502 jusqu'au redémarrage de nginx.
    # La cible doit passer par une variable pour que la résolution soit refaite.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cible_api http://api:8000;

    # Les noms de fichiers portent une empreinte : ils ne changent jamais à contenu égal.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass $cible_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un export PDF ou une recherche synchrone peut dépasser la minute.
        proxy_read_timeout 300s;
    }

    # Suivi en direct d'une investigation : connexion maintenue ouverte.
    location /ws/ {
        proxy_pass $cible_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Application en page unique : toute autre route est servie par index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
